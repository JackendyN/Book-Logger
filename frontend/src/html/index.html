<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Book Logger</title>
        <meta name="description" content="Web application for logging books read and books that are wished for.">
        <link rel="stylesheet" href="../css/styles.css">
        <link rel="stylesheet" href="../css/login.css">
        <link rel="stylesheet" type="text/css" href="//fonts.googleapis.com/css?family=Alice" />
        <link rel="apple-touch-icon" sizes="180x180" href="../../assets/apple-touch-icon.png">
        <link rel="icon" type="image/png" sizes="32x32" href="../../assets/favicon-32x32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="../../assets/favicon-16x16.png">
        <link rel="manifest" href="../../assets/site.webmanifest">
    </head>
    <body>
        <h2 id="title">Book Logger</h2>
        <h1 id="greeting">Welcome!</h1>

        <form id="login-form" method="POST">
            <div class="login-elements">
                <label for="username">Username: </label>
                <input type="text" id="username" name="username">
            </div>
            <div class="login-elements">
                <label for="password">Password: </label>
                <input type="password" id="password" name="password">
            </div>
            <button type="submit">Log In</button>
            <button id="register">Create Account</button>
        </form>

        <script type="module" src="../../dist/script/index.js" defer></script>
    </body>
</html>
