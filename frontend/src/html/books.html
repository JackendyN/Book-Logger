<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Books - Book Logger</title>
        <meta name="description" content="Web application for logging books read and books that are wished for.">
        <link rel="stylesheet" href="../css/styles.css">
        <link rel="stylesheet" href="../css/bookmenu.css">
        <link rel="stylesheet" href="../css/books.css">
        <link rel="stylesheet" type="text/css" href="//fonts.googleapis.com/css?family=Alice" />
        <link rel="apple-touch-icon" sizes="180x180" href="../../assets/apple-touch-icon.png">
        <link rel="icon" type="image/png" sizes="32x32" href="../../assets/favicon-32x32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="../../assets/favicon-16x16.png">
        <link rel="manifest" href="../../assets/site.webmanifest">
    </head>
    <body>
        <button id="back" aria-label="Go back">←</button>
        <h1><span class="bold">View Books</span></h1>

        <div id="controls">
            <div id="filter-container">
                <button id="filter-button" 
                        aria-haspopup="true"
                        aria-expanded="false"
                        aria-controls="filter-menu">
                Filters</button>
                <div id="filter-menu">
                    <button id="date-button">Date</button>
                    <div id="date-submenu" class="submenu">
                        <form>
                            <label>Month: 
                                <select id="month-filter-select">
                                    <option value="1">January</option>
                                    <option value="2">February</option>
                                    <option value="3">March</option>
                                    <option value="4">April</option>
                                    <option value="5">May</option>
                                    <option value="6">June</option>
                                    <option value="7">July</option>
                                    <option value="8">August</option>
                                    <option value="9">September</option>
                                    <option value="10">October</option>
                                    <option value="11">November</option>
                                    <option value="12">December</option>
                                </select></label>
                            
                            <label>Year: 
                                <select id="year-filter-select" required>
                                    <option>2026</option>
                                    <option>2025</option>
                                    <option>2024</option>
                                </select>
                            </label>
                            
                            <button type="submit">Update</button>
                        </form>        
                    </div>
                    <button id="obtained-button">Method Obtained</button>
                    <div id="obtain-submenu" class="submenu">
                        <form>
                            <label>Borrowed: 
                                <input type="checkbox" value="borrowed" checked>
                            </label>
                            <label>Owned: 
                                <input type="checkbox" value="owned" checked>
                            </label>
                            <button type="submit">Update</button>
                        </form>
                    </div>
                    <button id="author-button">Author</button>
                    <div id="author-submenu" class="submenu">
                        <form>
                            <label> Author:
                                <input required type="text" id="author-filter-input" name="author-name">
                            </label>
                            <button type="submit">Update</button>
                        </form>
                    </div>
                </div>
            </div>

            <div id="order-container">
                <button id="order-button">Order By</button>

                <form id="set-order-form">
                    <label>
                        <input type="radio" name="order" value="chronological">
                        Chronological
                    </label>

                    <label>
                        <input type="radio" name="order" value="alphabetical">
                        Alphabetical
                    </label>
                </form>
            </div>
        </div>

        <div id="book-container">
            <h2 class="listing-year"><span class="bold">2026: </span></h2>
            <hr>
            <div class="book-listing">
                <img class="book-cover" 
                src="https://m.media-amazon.com/images/S/compressed.photo.goodreads.com/books/1586722975i/2767052.jpg"
                alt=""
                tabindex="0">
                <div class="book-info">
                    <h3><span class="bold">Book Title</span></h3>
                    <h4>by <span class="bold">Book Author</span></h4>
                </div>
                <div class="when-obtained">
                    <h3><span class="bold">Obtained On:</span></h3>
                    <h3>MM/DD/YY</h3>
                </div>
            </div>
        </div>
        <p>You can update a book by clicking/pressing the cover!</p>

        <script src="../../dist/script/booklist.js" defer></script>
    </body>
</html>
